name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      mode: stable
      tag: ${{ inputs.tag || github.ref_name }}
