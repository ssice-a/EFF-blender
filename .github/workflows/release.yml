name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      FRAMEWORK_TAG: v1.6.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Checkout paired framework sources
        uses: actions/checkout@v4
        with:
          repository: ssice-a/EFF
          ref: ${{ env.FRAMEWORK_TAG }}
          path: framework
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: numpy Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
      - name: Build add-on-owned compiler with source discovery
        shell: pwsh
        run: |
          cmd /c framework\tools\build_resource_pack.cmd v35
          if ($LASTEXITCODE -ne 0) { throw 'Author compiler build failed' }
      - name: Build author core and Python dependencies
        shell: pwsh
        run: |
          cmd /c framework\tools\diagnostics\build_author_core.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Author core build failed' }
          python -m pip install --only-binary=:all: --target framework/bin/author-core/vendor Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow dependency install failed' }
      - name: Verify release tag matches Blender version
        shell: bash
        run: |
          python - <<'PY'
          import ast, os
          source = ast.parse(open('__init__.py', encoding='utf-8').read())
          info = next(ast.literal_eval(node.value) for node in source.body
                      if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == 'bl_info'
                              for target in node.targets))
          expected = 'v' + '.'.join(map(str, info['version']))
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Tag {actual} does not match Blender {expected}')
          PY
      - name: Build add-on archive
        shell: pwsh
        run: |
          $package = "EFF_Blender"
          $paired = git -C framework/tools/Blender rev-parse HEAD
          $current = git rev-parse HEAD
          if ($paired -ne $current) { throw 'Framework tag pins another Blender commit' }
          python framework/tools/diagnostics/bundle_blender_native_export.py --output $package --compiler framework/bin/resource-pack-v35/eff_resource_pack.exe --abi 35
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Blender bundle failed' }
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES -Destination $package
          Compress-Archive -Path $package -DestinationPath "EFF_Blender_${{ env.RELEASE_TAG }}.zip"
      - name: Verify author export and publication contracts
        working-directory: framework
        shell: pwsh
        run: |
          # Source tests require the add-on-owned core. Use this freshly built
          # bundle rather than an installed developer copy or game tools.
          Copy-Item ../EFF_Blender/nativepack -Destination tools/Blender/nativepack -Recurse
          # Canonical temp paths also keep failure-injection fixtures in older
          # tags consistent when Windows exposes RUNNER~1 short-path aliases.
          $testTemp = Join-Path $pwd '.author-test-temp'
          New-Item -ItemType Directory -Force $testTemp | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          $env:PYTHONPATH = "$pwd/tools/Blender;$pwd/tools"
          python -m unittest test_eiem_native_export_core test_eiem_native_publish test_eiem_offline_reload test_eiem_release test_eiem_shape_animation_package
          if ($LASTEXITCODE -ne 0) { throw 'Author export tests failed' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: EFF_Blender_${{ env.RELEASE_TAG }}.zip
          body_path: RELEASE_NOTES.md
