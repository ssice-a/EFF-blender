name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      FRAMEWORK_TAG: v1.3.0
    steps:
      - uses: actions/checkout@v4
      - name: Checkout paired framework sources
        uses: actions/checkout@v4
        with:
          repository: ssice-a/EFF
          ref: ${{ env.FRAMEWORK_TAG }}
          path: framework
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch paired compiler and source tool
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FRAMEWORK_TAG --repo ssice-a/EFF --pattern "EFF_${env:FRAMEWORK_TAG}_dll.zip" --dir framework/bin/paired-release
          if ($LASTEXITCODE -ne 0) { throw 'Paired EFF release unavailable' }
          Expand-Archive "framework/bin/paired-release/EFF_${env:FRAMEWORK_TAG}_dll.zip" framework/bin/paired-game
          Copy-Item framework/bin/paired-game/plugin/tools/static-sources framework/bin/static-sources -Recurse
      - name: Build author core and Python dependencies
        shell: pwsh
        run: |
          cmd /c framework\tools\diagnostics\build_author_core.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Author core build failed' }
          python -m pip install --only-binary=:all: --target framework/bin/author-core/vendor Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow dependency install failed' }
      - name: Verify release tag matches Blender version
        shell: bash
        run: |
          python - <<'PY'
          import ast, os
          source = ast.parse(open('__init__.py', encoding='utf-8').read())
          info = next(ast.literal_eval(node.value) for node in source.body
                      if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == 'bl_info'
                              for target in node.targets))
          expected = 'v' + '.'.join(map(str, info['version']))
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'Tag {actual} does not match Blender {expected}')
          PY
      - name: Build add-on archive
        shell: pwsh
        run: |
          $package = "EFF_Blender"
          $paired = git -C framework/tools/Blender rev-parse HEAD
          $current = git rev-parse HEAD
          if ($paired -ne $current) { throw 'Framework tag pins another Blender commit' }
          python framework/tools/diagnostics/bundle_blender_native_export.py --output $package --compiler framework/bin/paired-game/plugin/tools/eff_resource_pack.exe --abi 35
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Blender bundle failed' }
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES -Destination $package
          Compress-Archive -Path $package -DestinationPath "EFF_Blender_${{ github.ref_name }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: EFF_Blender_${{ github.ref_name }}.zip
          body_path: RELEASE_NOTES.md
