name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches Blender version
        run: |
          python - <<'PY'
          import ast, os
          source = ast.parse(open('__init__.py', encoding='utf-8').read())
          info = next(ast.literal_eval(node.value) for node in source.body
                      if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == 'bl_info'
                              for target in node.targets))
          expected = 'v' + '.'.join(map(str, info['version']))
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'Tag {actual} does not match Blender {expected}')
          PY
      - name: Build add-on archive
        shell: pwsh
        run: |
          $package = "EFF_Blender"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item __init__.py,eiem_blender_addon.py,eiem_blender_controls.py,eiem_native_export.py,eiem_offline_reload.py,eiem_release.py,eiem_format.py,eiem_lod.py,eiem_physics_authoring.py,eiem_physics_document.py,eiem_physics_native.py,eiem_physics_source.py,README.md,LICENSE,THIRD_PARTY_NOTICES -Destination $package
          if (-not (Test-Path nativepack)) { throw 'Release requires a generated nativepack/ bundle; run the canonical tools/diagnostics/bundle_blender_native_export.py step before packaging.' }
          Copy-Item nativepack -Destination $package -Recurse
          if (Test-Path vendor) { Copy-Item vendor -Destination $package -Recurse }
          Compress-Archive -Path $package -DestinationPath "EFF_Blender_${{ github.ref_name }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: EFF_Blender_${{ github.ref_name }}.zip
          body_path: RELEASE_NOTES.md
