name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release after its paired EFF native base is published
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      mode: stable
      tag: ${{ inputs.tag || github.ref_name }}
